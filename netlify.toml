[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.googleapis.com https://*.google.com https://www.googletagmanager.com https://www.google-analytics.com https://*.userway.org https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.userway.org; font-src 'self' https://fonts.gstatic.com https://*.userway.org; img-src 'self' data: https: ; connect-src 'self' https://*.googleapis.com https://*.gstatic.com https://*.google.com https://www.google-analytics.com https://us.i.posthog.com https://*.userway.org; frame-src https://calendar.google.com https://*.userway.org; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/style.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/favicon/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[redirects]]
  from = "/kids-zone.html"
  to = "/games.html"
  status = 301
  force = true
